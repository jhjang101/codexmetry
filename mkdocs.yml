site_name: Codexmetry
site_url: https://jhjang101.github.io/codexmetry/

# 1. Pathing (The Forensic Anchor)
docs_dir: documentation    # Where you write your Markdown
site_dir: docs/documentation # Where MkDocs outputs the HTML

# 2. Theme & Branding (Mirrors App)
theme:
  name: material
  logo: assets/logo_default.svg
  favicon: assets/favicon.svg
  palette: 
    # - media: "(prefers-color-scheme)"
    #   toggle:
    #     icon: material/brightness-auto
    #     name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
extra_css:
  - stylesheets/extra.css

# 3. Content Navigation Structure
nav:
  - Overview: index.md
  - How-To Guides:
    - Deployment: guides/deployment.md
    - Workflow: guides/workflow.md
    - Restoration: guides/restore.md
  - Technical Reference:
    - Orders (CDX): reference/orders.md
    - Invoices: reference/invoices.md

# 4. Plugins
plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences