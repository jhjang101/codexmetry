services:
  db:
    image: postgres:17-alpine
    container_name: codexmetry_db
    restart: always
    # Uncomment to allow host-access (DBeaver/pgAdmin)
    # ports:
    #    - "127.0.0.1:5432:5432" 
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/jhjang101/codexmetry:latest
    container_name: codexmetry_app
    restart: always
    ports:
      - "5001:5001"
    env_file: .env
    volumes:
      - ./data/uploads:/app/app/static/uploads
      - ./data/backups:/app/app/backups
      - ./data/logs:/app/app/logs
    depends_on:
      db:
        condition: service_healthy