{# PRIMARY RESPONSE: This fills the targeted line-total-{{ row_id }} div #}
{% if row_id %}
    {{ line_total | usd }}
{% endif %}

{# OOB RESPONSE: This teleports to the footer in form.html #}
<span id="grand-total-display" 
      hx-swap-oob="true" 
      class="text-lg font-medium 
        {% if mode == 'add' %}
            text-blue-700
        {% else %}
            {{ 'text-red-600' if grand_total >= 0 else 'text-green-600' }}
      {% endif %}">
    {{ grand_total | usd }}
</span>
