<div class="relative" id="po-select-container">
    {% set is_disabled = not pos and mode != 'view' %}
    <select name="po_id" 
            {{ 'disabled' if is_disabled else '' }}
            class="mt-1 block w-full border rounded-lg p-2 text-sm focus:ring-1 focus:ring-blue-300 outline-none appearance-none pr-10 {{ 'bg-gray-100 text-gray-400 cursor-not-allowed' if is_disabled else 'bg-transparent cursor-pointer' }}"
            hx-get="{{ url_for('expenses.update_po_cascades') }}"
            hx-target="#none"
            hx-trigger="change"
            required>
        <option value="">{{ 'Select Client first...' if is_disabled else 'Select PO' }}</option>
        {% for p in pos %}
            <option value="{{ p.id }}" 
                {{ 'selected' if (expense and expense.po_id == p.id) else '' }}>
                {{ p.order.order_number }} ({{ p.po_number if p.po_number else 'No Ref' }})
            </option>
        {% endfor %}
    </select>
    <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-gray-400">
        <i class="fa-solid fa-chevron-down text-[10px]"></i>
    </div>
</div>
