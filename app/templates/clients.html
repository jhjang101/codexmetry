{% extends 'layout.html' %}
{% block title %}Client Directory{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto">
    <!-- Header with Action Button -->
    <div class="flex justify-between items-end mb-4">
        <!-- Search Bar -->
        <div class="relative w-1/5">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-500">
                <i class="fa-solid fa-magnifying-glass text-sm"></i>
            </span>
            <input type="text" 
                   name="search"
                   value="{{ search }}"
                   placeholder="Search company name..." 
                   class="mt-1 block text-sm w-full border rounded-lg pl-10 p-2" 
                   hx-get="/clients" 
                   hx-trigger="keyup changed delay:300ms" 
                   hx-target="#client-table-container"
                   hx-push-url="true"> <!-- This keeps the URL in sync: /clients?search=... -->
        </div>
        <!-- Add New Button -->
        <a href="/clients/add" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-blue-700 transition-colors">
            + Add New Client
        </a>
    </div>

    <!-- Table Card -->
    <div id="client-table-container" class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
        {% include 'partials/client_table.html' %}
    </div>
</div>
{% endblock %}
