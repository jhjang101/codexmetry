{% extends 'layout.html' %}
{% block title %}Products - Codexmetry{% endblock %}
{% block header %}Products{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto">

    <!-- Header with Search -->
    <div class="flex justify-between items-center mb-4">
        <div class="relative w-1/3">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
                <i class="fa-solid fa-magnifying-glass text-sm"></i>
            </span>
            <input type="text" 
                   name="search" 
                   value="{{ search or '' }}"
                   placeholder="Search name, catalog #, or category..." 
                   class="mt-1 block text-sm w-full border rounded-lg pl-10 p-2 focus:ring-1 focus:ring-blue-300 outline-none"
                   hx-get="{{ url_for('products.index') }}" 
                   hx-trigger="keyup changed delay:300ms, search" 
                   hx-target="#product-list-container" 
                   hx-push-url="true">
        </div>
        <a href="{{ url_for('products.add') }}" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-blue-700 transition-colors">
            + Add New Product
        </a>
    </div>

    <!-- Table Container -->
    <div id="product-list-container" class="bg-white rounded-lg shadow border border-gray-200 overflow-hidden">
        {% include 'products/partials/list.html' %}
    </div>
    
</div>
{% endblock %}
