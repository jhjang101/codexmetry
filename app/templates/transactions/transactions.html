{% extends 'layout.html' %}
{% block title %}Transactions - Codexmetry{% endblock %}
{% block header %}Transactions{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto">
    <div class="flex justify-between items-center mb-2">
        <!-- Live Search -->
        <div class="relative w-1/3 group">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400 group-focus-within:text-blue-500">
                <i class="fa-solid fa-magnifying-glass text-sm"></i>
            </span>
            <input type="text" name="search" value="{{ search or '' }}"
                   placeholder="Search ID, description, or category..." 
                   class="mt-1 block text-sm w-full border rounded-lg pl-10 p-2 focus:ring-1 focus:ring-blue-300 outline-none"
                   hx-get="{{ url_for('transactions.index') }}" 
                   hx-trigger="keyup changed delay:300ms, search" 
                   hx-target="#trx-list-container"
                   hx-push-url="true">
        </div>

        <a href="{{ url_for('transactions.add') }}" 
           class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-blue-700 shadow-sm">
            <i class="fa-solid fa-plus mr-1"></i> Add New Transaction
        </a>
    </div>

    <div id="trx-list-container" class="bg-white rounded-lg shadow border border-gray-200 overflow-hidden">
        {% include 'transactions/partials/list.html' %}
    </div>
</div>
{% endblock %}
