{% extends 'layout.html' %}

{% block title %}Quotes - Codexmetry{% endblock %}
{% block header %}Quotes{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto">
    
    <!-- Action Header -->
    <div class="flex justify-between items-center mb-2">
        
        <!-- Live Search Bar -->
        <div class="relative w-1/3 group">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400 group-focus-within:text-blue-500 transition-colors">
                <i class="fa-solid fa-magnifying-glass text-sm"></i>
            </span>
            <input type="text" 
                   name="search" 
                   value="{{ search or '' }}"
                   placeholder="Search quotes, clients, or status..." 
                   class="mt-1 block text-sm w-full border rounded-lg pl-10 p-2 focus:ring-1 focus:ring-blue-300 outline-none transition-all"
                   hx-get="{{ url_for('quotes.index') }}" 
                   hx-trigger="keyup changed delay:300ms, search" 
                   hx-target="#quotes-list-container"
                   hx-push-url="true">
        </div>

        <!-- Add Quote Button -->
        {% if current_user.role in ['admin', 'user'] %}
            <a href="{{ url_for('quotes.add') }}" 
            class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-blue-700 transition-colors shadow-sm">
                <i class="fa-solid fa-plus mr-1"></i> Add New Quote
            </a>
        {% endif %}
    </div>

    <!-- Table Container (HTMX Target) -->
    <div id="quotes-list-container" class="bg-white rounded-lg shadow border border-gray-200 overflow-hidden">
        {% include 'quotes/partials/list.html' %}
    </div>

</div>
{% endblock %}
