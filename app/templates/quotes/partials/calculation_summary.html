<!-- Update the Grand Total area -->
<div id="calculation-summary" hx-swap-oob="true" class="mt-6 pt-4 border-t border-gray-100 flex justify-end">
    <div class="text-right">
        <span class="text-sm text-gray-500 uppercase font-bold mr-4">Total Amount:</span>
        <span class="text-2xl font-bold text-blue-700">{{ grand_total }}</span>
    </div>
</div>

<!-- Update each line total display individually using a simple selector sweep -->
<script>
    (function() {
        const lineTotals = {{ line_totals | tojson }};
        const rows = document.querySelectorAll('.line-total-display');
        lineTotals.forEach((total, index) => {
            if (rows[index]) rows[index].innerText = total;
        });
    })();
</script>
