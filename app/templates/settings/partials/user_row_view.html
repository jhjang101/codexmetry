<tr id="user-row-{{ user.id }}" class="hover:bg-blue-50/40 transition-colors group">
    <td class="px-4 py-3 whitespace-nowrap text-xs font-bold text-gray-700">
        {{ user.username }}
    </td>
    <td class="px-4 py-3 whitespace-nowrap text-xs text-gray-700">
        {{ user.full_name or '-' }}
    </td>
    <td class="px-4 py-3 whitespace-nowrap text-xs text-gray-600">
        {{ user.email }}
    </td>
    <td class="px-4 py-3 whitespace-nowrap text-xs text-gray-600">
        {{ user.phone_number or '-' }}
    </td>
    <td class="px-4 py-3 whitespace-nowrap">
        <span class="text-[10px] font-bold uppercase tracking-wider text-gray-500 bg-gray-100 px-2 py-0.5 rounded">
            {{ user.role }}
        </span>
    </td>
    <td class="px-4 py-3 whitespace-nowrap">
        <button hx-post="{{ url_for('settings.toggle_user_status', id=user.id) }}"
                hx-target="#user-row-{{ user.id }}"
                hx-swap="outerHTML"
                class="flex items-center gap-2 group/toggle">
            <div class="w-7 h-4 rounded-full p-0.5 transition-colors {{ 'bg-blue-500' if user.is_active else 'bg-gray-300' }}">
                <div class="w-3 h-3 bg-white rounded-full shadow-sm transition-transform {{ 'translate-x-3' if user.is_active else 'translate-x-0' }}"></div>
            </div>
            <span class="text-[10px] font-semibold {{ 'text-blue-700' if user.is_active else 'text-gray-400' }}">
                {{ 'Active' if user.is_active else 'Disabled' }}
            </span>
        </button>
    </td>
    <td class="px-4 py-3 text-right whitespace-nowrap">
        <button hx-get="{{ url_for('settings.edit_user_row', id=user.id) }}"
                hx-target="#user-row-{{ user.id }}"
                hx-swap="outerHTML"
                class="text-gray-400 hover:text-blue-600 transition-colors">
            <i class="fa-regular fa-pen-to-square"></i>
        </button>
    </td>
</tr>
