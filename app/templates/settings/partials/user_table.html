<div id="user-management-container" class="bg-white rounded-lg overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
        <thead>
            <tr class="text-xs font-semibold text-gray-500 uppercase tracking-wider">
                <th class="px-6 py-4 text-left">Username</th>
                <th class="px-6 py-4 text-left">Email Address</th>
                <th class="px-6 py-4 text-left">Role</th>
                <th class="px-6 py-4 text-left">Status</th>
                <th class="px-6 py-4 w-16"></th>
            </tr>
        </thead>
        <tbody id="user-table-body" class="divide-y divide-gray-100">
            {% for user in users %}
                {% include 'settings/partials/user_row_view.html' %}
            {% endfor %}
            
            <!-- Inline "Add User" Row (Matches Contact Input Style) -->
            <tr class="bg-gray-50/50">
                <td class="px-2 py-3">
                    <input type="text" name="username" placeholder="Username" 
                           class="block w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-1 focus:ring-blue-300 outline-none transition-all">
                </td>
                <td class="px-2 py-3">
                    <input type="email" name="email" placeholder="Email" 
                           class="block w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-1 focus:ring-blue-300 outline-none transition-all">
                </td>
                <td class="px-2 py-3">
                    <div class="relative">
                        <select name="role" 
                                class="block w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-1 focus:ring-blue-300 outline-none appearance-none bg-white cursor-pointer pr-8 uppercase" required>
                            <option value="viewer">Viewer</option>
                            <option value="user">User</option>
                            <option value="admin">Admin</option>
                        </select>
                        <div class="absolute inset-y-0 right-0 flex items-center px-2 pointer-events-none text-gray-400">
                            <i class="fa-solid fa-chevron-down text-[10px]"></i>
                        </div>
                    </div>
                </td>
                <td class="px-2 py-3">
                    <input type="password" name="password" placeholder="Password" 
                           class="block w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-1 focus:ring-blue-300 outline-none transition-all">
                </td>
                <td class="px-2 py-3 text-right">
                    <button hx-post="{{ url_for('settings.add_user') }}"
                            hx-target="#user-management-container"
                            hx-swap="outerHTML"
                            hx-include="closest tr"
                            class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-blue-700 transition-colors">
                        Add
                    </button>
                </td>
            </tr>
        </tbody>
    </table>
</div>
