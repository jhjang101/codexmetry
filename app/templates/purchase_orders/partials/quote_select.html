<div class="relative" id="quote-select-container">
    {# Is there a client selected? #}
    {% set client_context = selected_id or (po.client_id if po else None) %}
    {% set is_disabled = not client_context and mode != 'view' %}

    <select name="quote_id" 
            {{ 'disabled' if is_disabled else '' }}
            class="mt-1 block w-full border rounded-lg p-2 text-sm 
            focus:ring-1 focus:ring-blue-300 outline-none appearance-none pr-10 
            {{ 'bg-gray-100 text-gray-400 cursor-not-allowed' if is_disabled else 'bg-transparent cursor-pointer' }}"
            hx-get="{{ url_for('purchase_orders.load_quote_items') }}"
            hx-target="#item-list"
            hx-swap="innerHTML"
            hx-trigger="change"
            hx-confirm="This will replace all current line items. Proceed?">

        {# Placeholder Logic #}
        <option value="">
            {{ 'Select Client first...' if is_disabled else ('No available quotes' if not quotes else 'No Quote (Manual Entry)') }}
        </option>

        {% for q in quotes %}
            <option value="{{ q.id }}" {{ 'selected' if (po and po.quote_id == q.id) else '' }}>
                {{ q.quote_number }} ({{ q.total_amount | usd }})
            </option>
        {% endfor %}
    </select>
    
    <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-gray-400">
        <i class="fa-solid fa-chevron-down text-[10px]"></i>
    </div>
</div>
