<div class="relative" id="quote-select-container">

    <select name="quote_id" 
            {% if not client_id and not po %}
            disabled
            {% endif %}
            class="mt-1 block w-full border rounded-lg p-2 text-sm 
            focus:ring-1 focus:ring-blue-300 outline-none appearance-none pr-10 
            {% if not client_id and not po %} bg-gray-100 text-gray-400 cursor-not-allowed
            {% else %} bg-transparent cursor-pointer
            {% endif %}"
            hx-get="{{ url_for('purchase_orders.load_quote_items') }}"
            hx-target="#item-list"
            hx-swap="innerHTML"
            hx-trigger="change"
            hx-confirm="This will replace all current line items. Proceed?">

        {# Placeholder Logic #}
        <option value="">
            {% if not client_id and not po %}Select Client first...
            {% else %}No Quote Link (Manual PO)
            {% endif %}
        </option>

        {% for quote in quotes %}
            <option value="{{ quote.id }}" 
                          {% if quote.id == quote_prefill_id %}
                          selected
                          {% elif po and quote.id == po.quote_id %}
                          selected
                          {% elif not po and quote.id == quote_id %}
                          selected
                          {% endif %}>
                {{ quote.quote_number }} ({{ quote.total_amount | usd }})
            </option>
        {% endfor %}
    </select>
    
    <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-gray-400">
        <i class="fa-solid fa-chevron-down text-[10px]"></i>
    </div>
</div>
