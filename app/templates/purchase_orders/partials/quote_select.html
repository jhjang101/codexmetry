<div class="relative" id="quote-select-container">
    <select name="quote_id" 
            class="mt-1 block w-full border rounded-lg p-2 text-sm focus:ring-1 focus:ring-blue-300 outline-none appearance-none bg-transparent cursor-pointer pr-10"
            hx-get="{{ url_for('purchase_orders.load_quote_items') }}"
            hx-target="#item-list"
            hx-trigger="change"
            hx-confirm="This will replace all current line items with items from the selected quote. Proceed?">
        <option value="">No Quote (Manual Entry)</option>
        {% for quote in quotes %}
            <option value="{{ quote.id }}"
            {# Logic: Select if this is the quote currently saved on the PO #}
                {% if po and po.quote_id == quote.id %}
                    selected
                {% endif %}>
            {{ quote.quote_number }} ({{ quote.total_amount | usd }})
        </option>
        {% endfor %}
    </select>
    <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-gray-400">
        <i class="fa-solid fa-chevron-down text-[10px]"></i>
    </div>
</div>
