<div id="amount-input-container">
    <label class="block text-sm font-medium text-gray-500">Amount</label>

    <div class="relative mt-1">
        <input type="text" name="amount" 
               value="{{ amount_prefill | usd if amount_prefill else '$0.00' }}"
               class="block w-full border rounded-lg p-2 text-sm 
               focus:ring-1 focus:ring-blue-300 outline-none transition-all"
               placeholder="0.00">
    </div>
</div>
