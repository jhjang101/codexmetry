<!-- 1. Update PO Dropdown (OOB) -->
<div id="po-select-container" hx-swap-oob="true" class="relative">
    <select name="po_id" 
            class="mt-1 block w-full border rounded-lg p-2 text-sm focus:ring-1 focus:ring-blue-300 outline-none appearance-none bg-transparent cursor-pointer pr-10"
            hx-get="{{ url_for('payments.update_po_cascade') }}"
            hx-target="#none"
            hx-trigger="change"
            required>
        <option value="">Select PO...</option>
        {% for po in pos %}
            <option value="{{ po.id }}">{{ po.order.order_number }} ({{ po.po_number or 'No Ref' }})</option>
        {% endfor %}
    </select>
    <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-gray-400">
        <i class="fa-solid fa-chevron-down text-[10px]"></i>
    </div>
</div>

<!-- 2. Reset Invoice Dropdown (OOB - Clear because client changed) -->
<div id="invoice-select-container" hx-swap-oob="true" class="relative">
    <select name="invoice_id" class="mt-1 block w-full border rounded-lg p-2 text-sm bg-gray-50 text-gray-400 outline-none appearance-none cursor-not-allowed pr-10" disabled>
        <option value="">Select PO first...</option>
    </select>
    <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-gray-300">
        <i class="fa-solid fa-chevron-down text-[10px]"></i>
    </div>
</div>

<!-- 3. Update Paid From (OOB - Default to match Client) -->
<div id="paid-from-select-container" hx-swap-oob="true" class="relative">
    <select name="paid_from_id" class="mt-1 block w-full border rounded-lg p-2 text-sm focus:ring-1 focus:ring-blue-300 outline-none appearance-none bg-transparent cursor-pointer pr-10" required>
        <option value="">Select Payer...</option>
        {% for client in clients %}
            <option value="{{ client.id }}" {{ 'selected' if selected_id == client.id else '' }}>
                {{ client.company_name }}
            </option>
        {% endfor %}
    </select>
    <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-gray-400">
        <i class="fa-solid fa-chevron-down text-[10px]"></i>
    </div>
</div>

<!-- 4. Reset Amount Field (OOB - Clear current balance) -->
<div id="amount-input-container" hx-swap-oob="true">
    <input type="text" name="amount" value="$0.00"
           class="mt-1 block w-full border rounded-lg p-2 text-sm focus:ring-1 focus:ring-blue-300 outline-none transition-all">
</div>
