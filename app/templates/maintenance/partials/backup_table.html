<table class="min-w-full text-xs" id="backup-list">
    <thead class="bg-gray-50 text-gray-500 uppercase font-bold text-[9px] border-b">
        <tr>
            <th class="px-6 py-3 text-left">Filename</th>
            <th class="px-6 py-3 text-left">Created At</th>
            <th class="px-6 py-3 text-right">Size</th>
            <th class="px-6 py-3 text-right">Actions</th>
        </tr>
    </thead>
    <tbody class="divide-y divide-gray-100">
        {% for backup in backups %}
        <tr class="hover:bg-gray-50 transition-colors group">
            <td class="px-6 py-3 font-mono text-blue-700 font-medium">{{ backup.filename }}</td>
            <td class="px-6 py-3 text-gray-500">{{ backup.created_at.strftime('%Y-%m-%d %H:%M:%S') }}</td>
            <td class="px-6 py-3 text-right text-gray-400 font-mono">
                {{ (backup.size / 1024 / 1024) | round(2) }} MB
            </td>
            <td class="px-6 py-3 text-right">
                <div class="flex justify-end gap-4">
                    <!-- Download (Standard GET) -->
                    <a href="{{ url_for('maintenance.download_backup', filename=backup.filename) }}" 
                       class="text-gray-400 hover:text-blue-600 transition-colors" title="Download">
                        <i class="fa-solid fa-download"></i>
                    </a>
                    <!-- Delete (HTMX) -->
                    <button hx-post="{{ url_for('maintenance.delete_backup', filename=backup.filename) }}"
                            hx-confirm="Delete this database snapshot? This cannot be undone."
                            hx-target="#backup-table-container"
                            class="text-gray-300 hover:text-red-500 transition-colors" title="Delete">
                        <i class="fa-solid fa-trash-can text-[10px]"></i>
                    </button>
                </div>
            </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="4" class="py-12 text-center text-gray-400 italic">
                No backups found. Create your first snapshot above.
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
