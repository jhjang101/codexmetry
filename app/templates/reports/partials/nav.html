<div class="flex items-end -mb-px">
    {# Tab 1: Monthly #}
    {% set is_monthly = request.endpoint == 'reports.index' %}
    <a href="{{ url_for('reports.index') }}" 
       class="px-6 py-2.5 text-[10px] font-black uppercase tracking-widest transition-all border-t border-l border-r rounded-t-lg
              {{ 'bg-white border-gray-200 text-blue-600 z-10' if is_monthly else 'bg-gray-100 border-transparent text-gray-400 hover:bg-gray-50' }}">
        Monthly Statement
    </a>

    {# Tab 2: Trends #}
    {% set is_trends = request.endpoint == 'reports.trends' %}
    <a href="{{ url_for('reports.trends') }}" 
       class="px-6 py-2.5 text-[10px] font-black uppercase tracking-widest transition-all border-t border-l border-r rounded-t-lg
              {{ 'bg-white border-gray-200 text-blue-600 z-10' if is_trends else 'bg-gray-100 border-transparent text-gray-400 hover:bg-gray-50' }}">
        Trends & Analytics
    </a>
</div>
