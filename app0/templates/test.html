{% extends 'layout.html' %}
{% block title %}Test{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto">

    <!-- 1. Metadata Form (Standard POST) -->
    <section class="bg-white p-6 rounded-lg shadow mb-8">
        <h2 class="text-xl font-semibold mb-4 border-b pb-2">Cascade</h2>

        <div class="grid grid-cols-9 gap-4">

            <div class="col-span-3">
                <label class="block text-sm font-medium text-gray-500">Client</label>
                <div class="relative">
                    <select name="client_id" 
                            class="mt-1 block w-full border rounded-lg p-2 text-sm focus:ring-1 focus:ring-blue-300 outline-none appearance-none bg-transparent cursor-pointer pr-10" 
                            hx-get="/client-cascade"
                            hx-target="#none"
                            hx-trigger="change"
                            required>
                        <option value="">Select Client...</option>
                        <option value="client 1">client 1</option>
                        <option value="client 2">client 2</option>
                        <option value="client 3">client 3</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-gray-400">
                        <i class="fa-solid fa-chevron-down text-[10px]"></i>
                    </div>
                </div>
            </div>

            <div class="col-span-3">
                <label class="block text-sm font-medium text-gray-500">PO</label>
                <div class="relative">
                    <select id="po-select" 
                            name="po_id" 
                            class="mt-1 block w-full border rounded-lg p-2 text-sm focus:ring-1 focus:ring-blue-300 outline-none appearance-none bg-transparent cursor-pointer pr-10" 
                            required>
                        <option value="">Select PO...</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 flex items-center px-3 pointer-events-none text-gray-400">
                        <i class="fa-solid fa-chevron-down text-[10px]"></i>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <section class="bg-white p-6 rounded-lg shadow mb-8">
        <h2 class="text-xl font-semibold mb-4 border-b pb-2">Table</h2>
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-white">
                <tr>
                    <th scope="col" class="px-6 py-4 text-left text-sm font-medium text-gray-500">Name</th>
                    <th scope="col" class="px-6 py-4 text-left text-sm font-medium text-gray-500">ID</th>
                </tr>
            <tbody id="id-container" class="bg-white divide-y divide-gray-200">
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap">Arya</td>
                    <td class="px-6 py-4 whitespace-nowrap">002</td>
                </tr>
                <tr>
                    <td class="px-6 py-4 whitespace-nowrap">Sansa</td>
                    <td class="px-6 py-4 whitespace-nowrap">002</td>
                </tr>
            </tbody>
        </table>
    </section>

    <div id="info">
        <p>001</p>
    </div>

    <div id="none" class="hidden"></div>

{% endblock %}
