<div class="grid grid-cols-10 gap-3 items-center mb-3 contact-row p-2">
    <div class="col-span-3">
        <!-- <label class="block text-sm font-medium text-gray-700">First Name</label> -->
        <input type="text" name="contact_first[]" value="{{ contact.first_name if contact else '' }}" 
               class="mt-1 block w-full border rounded-lg p-2">
    </div>
    <div class="col-span-3">
        <!-- <label class="block text-sm font-medium text-gray-700">Last Name</label> -->
        <input type="text" name="contact_last[]" value="{{ contact.last_name if contact else '' }}" 
               class="mt-1 block w-full border rounded-lg p-2">
    </div>
    <div class="col-span-3">
        <!-- <label class="block text-sm font-medium text-gray-700">Email Address</label> -->
        <input type="email" name="contact_email[]" value="{{ contact.email if contact else '' }}" 
               class="mt-1 block w-full border rounded-lg p-2">
    </div>
    <div class="col-span-1 text-center self-end pb-1">
        <button type="button" 
                class="text-red-500 hover:text-red-800 remove-row text-lg font-bold"
                onclick="this.closest('.contact-row').remove()">
            ×
        </button>
    </div>
</div>
